<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Страница не найдена — ООО «НЕФТЕБАЗА ЧЕРЕПАНОВО»</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
       font-family:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
       background:#F0F0F0;color:#494949;text-align:center;padding:24px}
  .code{font-size:72px;font-weight:700;line-height:1;color:#fa876b;margin:0 0 12px}
  h1{font-size:24px;font-weight:600;margin:0 0 12px}
  p{font-size:16px;line-height:1.5;margin:0 0 28px;color:#7a7a7a}
  a.btn{display:inline-block;background:#fa876b;color:#fff;text-decoration:none;
        padding:14px 34px;border-radius:4px;font-size:15px;font-weight:600;
        letter-spacing:.5px;transition:background .2s}
  a.btn:hover{background:#ff8562}
</style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <h1>Страница не найдена</h1>
    <p>Возможно, страница была перемещена или адрес указан с ошибкой.</p>
    <a class="btn" id="home" href="/">На главную</a>
  </div>
  <script>
    // Works both for user sites (name.github.io) and project sites (name.github.io/repo/)
    (function () {
      var base = '/';
      var seg = location.pathname.split('/').filter(Boolean);
      if (/\.github\.io$/i.test(location.hostname) && seg.length) base = '/' + seg[0] + '/';
      document.getElementById('home').setAttribute('href', base);
    })();
  </script>
</body>
</html>
